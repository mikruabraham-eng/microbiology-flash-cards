<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbiology History Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option input[type="radio"] {
            margin-right: 15px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            accent-color: #667eea;
        }

        .option-text {
            font-size: 1em;
            color: #333;
            flex: 1;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #fdf1f1;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.95em;
            color: #555;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: #999;
        }

        .reset-btn:hover {
            box-shadow: 0 6px 20px rgba(153, 153, 153, 0.4);
        }

        .results {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5em;
            font-weight: bold;
        }

        .score-percentage {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .results-message {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .content {
                padding: 20px;
            }

            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 Historical Developments in Microbiology</h1>
            <p>Test your knowledge about key milestones and scientists in microbiology</p>
        </div>

        <div class="content">
            <div id="quiz-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>

                <div class="options" id="optionsContainer"></div>

                <div class="feedback" id="feedback">
                    <span id="feedbackText"></span>
                    <div class="explanation" id="explanation"></div>
                </div>

                <div class="buttons">
                    <button id="submitBtn" onclick="submitAnswer()">Submit Answer</button>
                    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question →</button>
                    <button id="resetBtn" class="reset-btn" onclick="resetQuiz()">Start Over</button>
                </div>
            </div>

            <div class="results" id="results">
                <h2>Quiz Complete!</h2>
                <div class="score-circle" id="scoreCircle"></div>
                <div class="score-percentage" id="scorePercentage"></div>
                <div class="results-message" id="resultsMessage"></div>
                <button onclick="resetQuiz()">Take Quiz Again</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Who is credited with inventing the microscope and first observing microorganisms?",
                options: [
                    "Antoine van Leeuwenhoek",
                    "Louis Pasteur",
                    "Robert Koch",
                    "Joseph Lister"
                ],
                correct: 0,
                explanation: "Antoine van Leeuwenhoek (1632-1723) was a Dutch scientist who designed microscopes and became the first to observe bacteria, protozoa, and other microorganisms around 1670."
            },
            {
                question: "Which scientist developed germ theory and demonstrated that microorganisms cause fermentation?",
                options: [
                    "Robert Koch",
                    "Louis Pasteur",
                    "Edward Jenner",
                    "Florence Nightingale"
                ],
                correct: 1,
                explanation: "Louis Pasteur (1822-1895) provided experimental proof that microorganisms cause fermentation and disease, laying the foundation for microbiology as we know it."
            },
            {
                question: "Who discovered penicillin, the first widely used antibiotic?",
                options: [
                    "Alexander Fleming",
                    "Paul Ehrlich",
                    "Gerhard Domagk",
                    "Howard Florey"
                ],
                correct: 0,
                explanation: "Alexander Fleming discovered penicillin in 1928 when he noticed that a mold contaminating a bacterial culture inhibited bacterial growth, revolutionizing medicine."
            },
            {
                question: "What is Koch's Postulate primarily used for?",
                options: [
                    "Identifying the type of microscope needed for observation",
                    "Establishing a causal relationship between a microorganism and disease",
                    "Determining the nutritional requirements of bacteria",
                    "Measuring the growth rate of microbial cultures"
                ],
                correct: 1,
                explanation: "Koch's Postulates, developed by Robert Koch, are a set of criteria to establish that a specific microorganism causes a specific disease."
            },
            {
                question: "Which technique, introduced by Joseph Lister, significantly reduced surgical infections?",
                options: [
                    "Sterilization",
                    "Pasteurization",
                    "Antiseptic surgery",
                    "Fermentation"
                ],
                correct: 2,
                explanation: "Joseph Lister introduced antiseptic surgery in the 1860s, using carbolic acid to disinfect wounds and surgical instruments, drastically reducing post-operative infections."
            },
            {
                question: "Who developed the technique of staining bacteria to observe them under microscopes?",
                options: [
                    "Christian Gram",
                    "Louis Pasteur",
                    "Edward Jenner",
                    "Paul Ehrlich"
                ],
                correct: 0,
                explanation: "Christian Gram developed the Gram staining technique in 1884, which revolutionized bacterial observation and classification, dividing bacteria into Gram-positive and Gram-negative."
            },
            {
                question: "What major breakthrough in vaccination came from Edward Jenner's work?",
                options: [
                    "Development of antibiotics",
                    "First vaccine against smallpox using cowpox virus",
                    "Discovery of viruses",
                    "Method for culturing bacteria"
                ],
                correct: 1,
                explanation: "Edward Jenner created the first successful vaccine in 1796 by using cowpox virus to protect against smallpox, establishing the principle of vaccination."
            },
            {
                question: "Which scientist won a Nobel Prize for discovering the ABO blood groups and contributed to microbiology?",
                options: [
                    "Paul Ehrlich",
                    "Karl Landsteiner",
                    "Max von Pettenkofer",
                    "Ilya Metchnikoff"
                ],
                correct: 1,
                explanation: "Karl Landsteiner discovered ABO blood groups and also made significant contributions to virology, discovering poliovirus and the concept of blood types."
            },
            {
                question: "Who developed the culture plate method for isolating pure bacterial colonies?",
                options: [
                    "Robert Koch",
                    "Julius Richard Petri",
                    "Louis Pasteur",
                    "Paul Ehrlich"
                ],
                correct: 1,
                explanation: "Julius Richard Petri modified the culture plate design in 1887, creating what we now call the Petri dish, allowing scientists to isolate and study pure bacterial colonies."
            },
            {
                question: "What was the primary focus of Paul Ehrlich's research in microbiology?",
                options: [
                    "Vaccine development",
                    "Staining techniques",
                    "Chemotherapy and antibacterial agents",
                    "Fermentation processes"
                ],
                correct: 2,
                explanation: "Paul Ehrlich (1854-1915) pioneered chemotherapy, developing synthetic drugs to treat bacterial infections. His work on Salvarsan was one of the first successful treatments for syphilis."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function loadQuestion() {
            const question = quizData[currentQuestion];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById('questionText').textContent = question.question;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `
                    <input type="radio" name="answer" value="${index}">
                    <span class="option-text">${option}</span>
                `;
                label.addEventListener('click', () => selectOption(index, label));
                optionsContainer.appendChild(label);
            });

            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';

            updateProgress();
            answered = false;
            selectedAnswer = null;
        }

        function selectOption(index, label) {
            if (answered) return;

            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            label.classList.add('selected');
            selectedAnswer = index;
        }

        function submitAnswer() {
            if (selectedAnswer === null) {
                alert('Please select an answer!');
                return;
            }

            answered = true;
            const question = quizData[currentQuestion];
            const isCorrect = selectedAnswer === question.correct;

            if (isCorrect) {
                score++;
                document.getElementById('feedback').classList.add('correct');
                document.getElementById('feedbackText').textContent = '✓ Correct!';
            } else {
                document.getElementById('feedback').classList.add('incorrect');
                document.getElementById('feedbackText').textContent = '✗ Incorrect!';
            }

            document.getElementById('explanation').textContent = question.explanation;
            document.getElementById('feedback').classList.add('show');

            document.querySelectorAll('.option').forEach((opt, index) => {
                if (index === question.correct) {
                    opt.classList.add('correct');
                } else if (index === selectedAnswer && !isCorrect) {
                    opt.classList.add('incorrect');
                }
                opt.style.pointerEvents = 'none';
                opt.style.cursor = 'default';
            });

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('results').classList.add('show');

            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('scoreCircle').textContent = `${score}/${quizData.length}`;
            document.getElementById('scorePercentage').textContent = `${percentage}%`;

            let message = '';
            if (percentage === 100) {
                message = "Perfect score! You're a microbiology history expert! 🎉";
            } else if (percentage >= 80) {
                message = "Excellent work! You have a strong understanding of microbiology history. 🌟";
            } else if (percentage >= 60) {
                message = "Good job! You know quite a bit about the historical developments in microbiology. 👍";
            } else if (percentage >= 40) {
                message = "Not bad! Keep studying to improve your knowledge of microbiology history. 📚";
            } else {
                message = "Keep learning! Microbiology has a fascinating history with so much to discover. 💡";
            }

            document.getElementById('resultsMessage').textContent = message;
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;

            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('results').classList.remove('show');

            loadQuestion();
        }

        // Initialize
        window.addEventListener('load', loadQuestion);
    </script>
</body>
</html>
